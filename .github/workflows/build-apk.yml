name: Build Android APK

on:
  push:
    branches:
      - main # Cambia in 'master' se il tuo ramo principale si chiama master
  workflow_dispatch: # Ti permette di avviare la build anche manualmente da GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installazione dipendenze
        run: npm ci

      - name: Build dell'app web
        run: npm run build

      - name: Sincronizzazione Capacitor con Android
        run: npx cap sync android

      - name: Generazione APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Caricamento APK tra gli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
