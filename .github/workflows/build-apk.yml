name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Decodifica keystore permanente
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > registro-lavorazioni.keystore

      - name: Trova zipalign e apksigner
        id: sdktools
        run: |
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Allinea APK
        run: |
          "${{ steps.sdktools.outputs.zipalign }}" -p 4 \
            android/app/build/outputs/apk/debug/app-debug.apk \
            app-aligned.apk

      - name: Firma APK con keystore permanente
        run: |
          "${{ steps.sdktools.outputs.apksigner }}" sign \
            --ks registro-lavorazioni.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out registro-lavorazioni.apk \
            app-aligned.apk

      - name: Upload APK (artifact di backup)
        uses: actions/upload-artifact@v4
        with:
          name: Registro-Lavorazioni-APK
          path: registro-lavorazioni.apk

      - name: Crea Release con APK scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Registro Lavorazioni - build ${{ github.run_number }}"
          files: registro-lavorazioni.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
