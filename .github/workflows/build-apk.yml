name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK (artifact di backup)
        uses: actions/upload-artifact@v4
        with:
          name: Registro-Lavorazioni-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk registro-lavorazioni.apk

      - name: Crea Release con APK scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Registro Lavorazioni - build ${{ github.run_number }}"
          files: registro-lavorazioni.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
